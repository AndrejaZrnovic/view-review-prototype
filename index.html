 fetch(BACKEND+'/style',{method:'POST',headers:{'Content-Type':'application/json','X-View-Review':'1'},body:JSON.stringify({images:refs().map(function(i){return {side:i.side,image:i.data}}),style:styleInfo()})})
 .then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);m.prev={img:j.image,scene:j.scene,sig:sig};m.busy=false;render()})
 .catch(function(e){m.err=(e&&e.message)||'Could not preview the scene.';m.busy=false;render()})}
function mdSlot(k,label,hint){var img=M.mood[k+'Img'],inp='<input type="file" accept="image/*" data-mood="'+k+'" hidden>';
 return '<div class="slots" style="display:grid;grid-template-columns:minmax(150px,210px);margin-top:8px"><div class="slot"><div class="st" style="margin-bottom:6px">'+label+'</div>'+(img?'<div class="pic"><img src="'+img+'" alt="'+label+'"></div><div class="sbt"><label class="upl">Replace'+inp+'</label><button data-a="mdrmimg" data-k="'+k+'">Remove</button></div>':'<label class="pic empty"><b>+</b>'+hint+inp+'</label>')+'</div></div>'}
function mdGrid(){var q=M.mood.q.trim().toLowerCase(),f=M.mood.f,list=TILES.filter(function(t){var hay=(t.title+' '+t.tags.join(' ')+' '+t.mood+' '+t.env).toLowerCase();return (f==='All'||t.tags.indexOf(f)>-1)&&(!q||hay.indexOf(q)>-1)});
 return list.length?list.map(function(t){var on=M.mood.sel.indexOf(t.id)>-1;return '<button class="tile'+(on?' on':'')+'" data-a="mdtog" data-id="'+t.id+'" title="'+esc(t.env)+'">'+tileSvg(t)+'<span class="b">'+(on?'✓':'+')+'</span><span class="tt">'+esc(t.title)+'</span></button>'}).join(''):'<p class="mut">No presets match your search.</p>'}
function mdBoard(){var m=M.mood,ok=prevOk(),thumb=function(src){return '<span style="width:96px;height:72px;border-radius:10px;overflow:hidden;display:inline-block;background:var(--well)"><img src="'+src+'" alt="" data-zoom style="width:100%;height:100%;object-fit:cover;cursor:zoom-in"></span>'};
 if(m.applied&&hasScene()){return '<div class="card"><h2>2. Scene and mood</h2><div class="row" style="justify-content:flex-start;gap:8px;margin-top:0">'+(m.prev?thumb(m.prev.img):'')+(m.bgImg?thumb(m.bgImg):'')+(m.mdImg?thumb(m.mdImg):'')+'</div><p class="mut" style="margin-top:8px">'+esc(styleText())+'</p><div class="row"><span class="st">'+(m.prev?'This is the approved scene. ':'')+'Your photo is restyled in this scene once, then every angle is made from it, so all views share one scene.</span><button data-a="mdedit">Edit scene</button></div></div>'}
 var needPhoto=BACKEND&&!M.imgs.length,can=hasScene()&&!needPhoto&&!m.busy;
 var h='<div class="card"><div class="mbh"><div><h2 style="margin:0">2. Scene and mood</h2><div class="st">Describe the background and the mood for this product, and add an example image of each. All optional; edit any time.</div></div><button data-a="mdpo">'+(m.pOpen?'Hide presets':'Start from a preset')+'</button></div>';
 if(m.pOpen)h+='<div class="st" style="margin-bottom:8px">Presets only fill in the words below. Click one, then change them to fit your product.</div><div class="row" style="margin:0 0 10px;justify-content:flex-start"><input id="mdq" placeholder="Search presets..." value="'+esc(m.q)+'">'+['All','Cinematic','Minimalist','Dark'].map(function(c){return '<button class="chip'+(m.f===c?' on':'')+'" data-a="mdf" data-v="'+c+'">'+c+'</button>'}).join('')+'</div><div class="mood" id="mdgrid">'+mdGrid()+'</div>';
 h+='<div class="mcols"><div class="mcol"><label>Background of the shot<textarea id="mdbg" rows="3" placeholder="e.g. light oak shelf in front of a sunny window, plant softly blurred behind">'+esc(m.bg)+'</textarea></label>'+mdSlot('bg','Background example','Upload a location photo')+'</div>'
  +'<div class="mcol"><label>Mood and lighting<textarea id="mdmd" rows="3" placeholder="e.g. warm, calm, soft morning light, long gentle shadows">'+esc(m.md)+'</textarea></label>'+mdSlot('md','Mood example','Upload a mood photo')+'</div></div>';
 if(m.busy)h+='<div class="mprev" role="status" aria-live="polite"><div class="thumb gen"><div class="shim"></div><div class="spin"></div><div class="gstep">Placing your product in the scene…</div></div><div class="st" style="margin-top:6px">Elapsed <b class="melapsed">'+mdElapsed()+'</b> · can take a few minutes</div></div>';
 else if(m.prev)h+='<div class="mprev"><div class="st" style="margin-bottom:6px">'+(ok?'Preview of your scene. Check the product is unchanged (shape, colour, markings), then use it.':'You changed the scene or photo: preview again.')+'</div><img src="'+m.prev.img+'" alt="Scene preview" data-zoom style="opacity:'+(ok?1:.45)+'"></div>';
 if(m.err)h+='<div class="err">'+esc(m.err)+'</div>';
 if(needPhoto)h+='<p class="warn">Upload a product photo above to preview the scene.</p>';
 h+='<div class="mbf"><span class="st">'+(BACKEND?'Preview first: you see the restyled photo before any angle is made.':'No generator connected: the scene only tints the mock views.')+'</span><div class="row" style="margin:0"><button data-a="mdclear">Clear all</button>'
  +(BACKEND?(m.prev?'<button data-a="mdretry"'+(can?'':' disabled')+'>Try another look</button><button '+(ok?'class="pri" data-a="mduse"':'data-a="mdprev" class="pri"'+(can?'':' disabled'))+'>'+(ok?'Use this scene →':'Preview scene')+'</button>':'<button class="pri" data-a="mdprev"'+(can?'':' disabled')+'>Preview scene</button>'):'<button class="pri" data-a="mdapply"'+(hasScene()?'':' disabled')+'>Apply scene →</button>')+'</div></div></div>';
 return h}
function copy(t){var m=document.getElementById('msg');try{navigator.clipboard.writeText(t).then(function(){m.textContent='Copied.'},function(){m.textContent='Copy failed. Select the text manually.'})}catch(x){m.textContent='Copy failed. Select the text manually.'}}
document.addEventListener('input',function(e){var t=e.target,d=t.dataset||{};if(t.id==='pid')S.pid=t.value;else if(d.a==='note')S.views[d.id].note=t.value;else if(d.f==='product')CFG.product=t.value;else if(d.f==='sheet')CFG.sheet=t.value;else if(d.f==='name')CFG.views[+d.i].name=t.value;else if(d.f==='shotn')CFG.shots[+d.i].n=t.value;else if(d.a==='ov'){S.ovPos=+t.value;var oa=document.querySelector('.ova');if(oa)oa.style.clipPath='inset(0 0 0 '+t.value+'%)'}else if(t.id==='mdq'){M.mood.q=t.value;var gg=document.getElementById('mdgrid');if(gg)gg.innerHTML=mdGrid()}else if(t.id==='mdbg'||t.id==='mdmd'){M.mood[t.id==='mdbg'?'bg':'md']=t.value;var pb=document.querySelector('[data-a="mdprev"],[data-a="mdapply"]');if(pb)pb.disabled=!hasScene()||!!(BACKEND&&!M.imgs.length)}else if(d.k){mkSet(d.k,+t.value)}else if(t.id==='mkp'){M.prompt=t.value;M.pe=true}else if(t.id==='mks'){M.sheet=t.value;var tt=document.getElementById('mkp');if(tt&&!M.pe)tt.value=autoPrompt()}});
document.addEventListener('change',function(e){var t=e.target,d=t.dataset||{};
 if(d.a==='conf'){S.views[d.id].conf=+t.value;log('confidence',{view:d.id,value:+t.value})}
 else if(d.a==='flag'){S.views[d.id].flag=t.checked;log('discrepancy_flag',{view:d.id,value:t.checked})}
 else if(d.a==='note'){log('discrepancy_note',{view:d.id,value:t.value})}
 else if(t.id==='cond')S.condSel=t.value;
 else if(t.id==='builtin'){BUILTIN=t.value;render()}
 else if(d.a==='custom'){CFG.custom=t.checked;render()}
 else if(d.a==='vq'){V.quality=t.value;render()}
 else if(d.a==='vd'){V.dur=t.value;render()}
 else if(d.a==='va'){V.aspect=t.value;render()}
 else if(d.a==='vloop'){V.loop=t.checked;render()}
 else if(d.f==='src'){CFG.views[+d.i].src=t.value;render()}
 else if(d.f==='err'){CFG.views[+d.i].err=t.checked;render()}
 else if(d.mood){var mf=t.files&&t.files[0];if(!mf)return;shrinkImg(mf,function(u){M.mood[d.mood+'Img']=u;M.mood.prev=null;M.mood.err='';render()})}
 else if(d.side){var fl=t.files&&t.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){setSide(d.side,rd.result,fl.name);render()};rd.readAsDataURL(fl)}
 else if(t.id==='mkfile'){Array.prototype.slice.call(t.files).slice(0,Math.max(0,3-M.imgs.length)).forEach(function(f){var r=new FileReader();r.onload=function(){M.imgs.push({name:f.name,data:r.result});render()};r.readAsDataURL(f)})}
 else if(d.a==='ovsel'){S.ovIdx=+t.value;log('overlay_ref',{ref:t.value});render()}
 else if(d.a==='ov'){log('overlay_drag',{view:S.cmp,pos:+t.value})}
 else if(d.f==='shotv')CFG.shots[+d.i].vi=+t.value;
 else if(d.f==='img'||d.f==='fix'){var f=t.files&&t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){CFG.views[+d.i][d.f]=r.result;render()};r.readAsDataURL(f)}});
document.addEventListener('click',function(e){var img=e.target.closest('img[data-zoom]');if(img){var z=document.getElementById('zoom');z.querySelector('img').src=img.src;z.showModal();return}if(e.target.id==='zoomclose'){document.getElementById('zoom').close();return}var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,id=b.dataset.id,s=id&&S.views[id];
 if(a==='consent'){if(!document.getElementById('cons').checked){document.getElementById('msg').textContent='Please tick the box to continue.';return}S.consent=true;S.step='tutorial'}
 else if(a==='start'){if(!applyCfg())return;S.pid=document.getElementById('pid').value.trim();S.stimulusSet=CFG.custom?'custom':BUILTIN;var c=document.getElementById('cond').value;S.cmode=document.getElementById('cmode').value;S.ovIdx=0;S.ovPos=50;S.cond=c==='random'?(Math.random()<.5?'baseline':'labeled'):c==='alt'?nextAlt():c;S.t0=Date.now();S.log=[];S.cmpMs=0;S.revMs=0;S.q=null;S.auth=false;S.mode='study';VIEWS=shuf(VIEWS);init();S.step='consent';log('start',{order:VIEWS.map(function(v){return v.id}),stimulus_set:S.stimulusSet})}
 else if(a==='go')goto(b.dataset.to)
 else if(a==='cmp'){if(S.cmp)closeCmp();S.cmp=id;S.views[id].cmpN++;S.cmpStart=Date.now();log('compare_open',{view:id})}
 else if(a==='closecmp')closeCmp()
 else if(a==='approve'){if(S.cond==='forced'&&s.src==='ai'&&!s.cmpN){S.toast='Please compare this view with your original materials before approving it.';log('approve_blocked',{view:id})}else{s.status='approved';S.toast='';log('approve',{view:id,source:s.src,viewed:S.cmp===id})}}
 else if(a==='reject'){s.status='rejected';S.toast=(S.cond!=='baseline'&&impact(id))?'Rejected. This affects '+impact(id)+'.':'';log('reject',{view:id,source:s.src})}
 else if(a==='replace'){s.spec=vget(id).truth;s.src='user';s.status='approved';s.replaced=true;S.toast=impact(id)?'Replaced. '+impact(id)+' will use your edited view.':'';log('replace',{view:id})}
 else if(a==='toggle'){s.status=s.status==='approved'?'rejected':'approved';log('toggle',{view:id,status:s.status})}
 else if(a==='submitq'){var ai=VIEWS.filter(function(v){return document.getElementById('qa_'+v.id).checked}).map(function(v){return v.id});S.q={ai:ai,qt:(qsel()||{}).id||'',q2:tcorr(),q3:document.getElementById('q3').value,q4:document.getElementById('q4').value,q5:document.getElementById('q5').value};log('questionnaire',S.q);goto('debrief');saveSession()}
 else if(a==='copylog'){copy(JSON.stringify(S.log));return}
 else if(a==='copyp'){copy(tsv(PH,allP()));return}
 else if(a==='copyv'){copy(tsv(VH,allV()));return}
 else if(a==='clear'){if(S.clr){try{localStorage.removeItem('sessions')}catch(x){}S.clr=false}else{S.clr=true}}
 else if(a==='addview'){CFG.views.push({name:'View '+(CFG.views.length+1),src:'ai',err:false,img:'',fix:''})}
 else if(a==='rmview'){var ri=+b.dataset.i;CFG.views.splice(ri,1);CFG.shots.forEach(function(sh){if(sh.vi===ri)sh.vi=0;else if(sh.vi>ri)sh.vi--})}
 else if(a==='mdtog'){var pt=TILES.filter(function(t){return t.id===b.dataset.id})[0];if(pt){if(M.mood.sel.indexOf(pt.id)>-1)M.mood.sel=[];else{M.mood.sel=[pt.id];M.mood.bg=pt.env;M.mood.md=pt.mood}}}
 else if(a==='mdpo'){M.mood.pOpen=!M.mood.pOpen}
 else if(a==='mdrmimg'){M.mood[b.dataset.k+'Img']='';M.mood.prev=null}
 else if(a==='mdprev'){mdPreview();return}
 else if(a==='mdretry'){M.mood.seed=(M.mood.seed||1)+1;mdPreview();return}
 else if(a==='mduse'){if(prevOk()){M.mood.applied=true;M.mood.err=''}else M.mood.err='You changed the scene or photo: preview it again.'}
 else if(a==='mdf'){M.mood.f=b.dataset.v}
 else if(a==='mdclear'){var mc=M.mood;mc.sel=[];mc.bg='';mc.md='';mc.bgImg='';mc.mdImg='';mc.prev=null;mc.err=''}
 else if(a==='mdapply'){M.mood.applied=true}
 else if(a==='mdedit'){M.mood.applied=false}
 else if(a==='mkreset'){for(var k in DEF)M[k]=DEF[k];kick()}
 else if(a==='mkpre'){M.az=+b.dataset.az;M.el=+b.dataset.el;if(M.snap)M.az=(Math.round(M.az/45)*45)%360;kick()}
 else if(a==='mksnap'){M.snap=!M.snap;if(M.snap)M.az=(Math.round(M.az/45)*45)%360;kick()}
 else if(a==='mkgo'){S.step='mk'}
 else if(a==='mkstudy'){S.step='setup'}
 else if(a==='home'){S.step='home'}
 else if(a==='mkrm'){M.imgs=M.imgs.filter(function(x){return x.side!==b.dataset.side})}
 else if(a==='mkrmg'){M.gen.splice(+b.dataset.i,1)}
 else if(a==='mkwipe'){if(!M.wipe){M.wipe=true;render();setTimeout(function(){M.wipe=false;render()},4000);return}M.wipe=false;M.imgs=[];M.gen=[];M.sheet='';M.pe=false;M.prompt='';M.mood=moodNew();V.seq=[];V.job=null;V.err='';for(var dk in DEF)M[dk]=DEF[dk]}
 else if(a==='mkel'){M.el=+b.dataset.v}
 else if(a==='mkdist'){M.dist=+b.dataset.v}
 else if(a==='mkgen'){mkGen();return}
 else if(a==='mkzoom'){LB=+b.dataset.i;lbShow();return}
 else if(a==='lbclose'){lbClose();return}
 else if(a==='lbprev'||a==='lbnext'){LB=(LB+(a==='lbnext'?1:-1)+M.gen.length)%M.gen.length;lbShow();return}
 else if(a==='mkreview'){startReview()}
 else if(a==='vtog'){var vx=M.gen[+b.dataset.i],vk=V.seq.indexOf(vx);if(vk>-1)V.seq.splice(vk,1);else V.seq.push(vx);V.ok=false}
 else if(a==='vclear'){V.seq=[];V.ok=false}
 else if(a==='vfill'){vFill();return}
 else if(a==='vmake'){if(vMaxTurn()>90&&!V.ok){V.ok=true;render();return}vMake();return}
 else if(a==='unlock'){var cd=document.getElementById('code');if(!cd||cd.value!==CODE){var mm=document.getElementById('msg');if(mm)mm.textContent='Wrong code.';return}S.auth=true;S.step=S.step==='debrief'?'results':'setup'}
 else if(a==='restart'){S.step='setup'}
 render()});
var renderPage=render;render=function(){renderPage();keepSoon()};
document.addEventListener('input',keepSoon);
render();
keepLoad().catch(function(){KEEP.ready=true});
