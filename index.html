<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>View Review Study Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#dedcce;--card:#f6f1e7;--tx:#241b1e;--mut:#6e6460;--bd:#c8c4b4;--ac:#7a4256;--ok:#3f7a5a;--bad:#a8433b;--warn:#9a6a1f;--pri:#4a2a35;--onpri:#f6f1e7;--glow1:#e9d2db;--glow2:#d3d6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1d21;--card:#37272c;--tx:#ebe6d8;--mut:#a99fa0;--bd:#4d393f;--ac:#dba7b8;--ok:#7fc29b;--bad:#ec8b80;--warn:#e3b66a;--pri:#ebe2d2;--onpri:#2b1d21;--glow1:#4d2a3b;--glow2:#2c2b44}}
:root[data-theme="dark"]{--bg:#2b1d21;--card:#37272c;--tx:#ebe6d8;--mut:#a99fa0;--bd:#4d393f;--ac:#dba7b8;--ok:#7fc29b;--bad:#ec8b80;--warn:#e3b66a;--pri:#ebe2d2;--onpri:#2b1d21;--glow1:#4d2a3b;--glow2:#2c2b44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}p{margin:0 0 10px}.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:12px}
.pill{border:1px solid var(--bd);border-radius:99px;padding:2px 9px;background:var(--card);color:var(--mut)}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}.grid .card{margin:0}.card.rej{opacity:.55}
.thumb{background:var(--bg);border-radius:8px;display:flex;justify-content:center;gap:6px;padding:6px;margin-bottom:8px}.thumb{flex-wrap:wrap}.thumb svg,.thumb img{height:120px;width:auto;max-width:100%;object-fit:contain}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:8px}
button{font:inherit;font-size:13px;padding:5px 11px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.ok{color:var(--ok)}button.no{color:var(--bad)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}.b-up{color:var(--ok)}.b-ai{color:var(--warn)}.b-ue{color:var(--ac)}
.st{font-size:12px;color:var(--mut)}.warn{color:var(--warn);font-size:13px}.err{color:var(--bad);font-size:13px}
.toast{background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cmp .thumb svg,.cmp .thumb img{height:160px}.vrow{border-top:1px solid var(--bd);padding:8px 0}.vrow img{height:48px;border-radius:4px;vertical-align:middle}.thumb.sm svg,.thumb.sm img{height:80px}.ov{position:relative;height:240px;background:var(--bg);border-radius:8px;overflow:hidden}.ov>div{position:absolute;inset:0}.ov svg,.ov img{width:100%;height:100%;object-fit:contain}
.spec{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px}
input,select{font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
label{display:block;margin-bottom:8px}.chk{display:inline-block;margin-right:14px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:11px}
table{border-collapse:collapse;font-size:13px;width:100%}td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}.wrap{overflow-x:auto}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1100px 520px at 88% -8%,var(--glow1),transparent 62%),radial-gradient(900px 520px at -8% 108%,var(--glow2),transparent 62%),var(--bg);background-attachment:fixed}
h1{font:500 28px/1.15 "Work Sans",Inter,system-ui,sans-serif;letter-spacing:-.015em;margin-bottom:8px}h2{font:500 16px/1.3 "Work Sans",Inter,system-ui,sans-serif}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font:500 11px "IBM Plex Mono",ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}.brand svg{color:var(--tx)}
.pill{font:500 10px "IBM Plex Mono",ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px}.pill.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{border-radius:18px;box-shadow:0 14px 34px -22px rgba(43,29,33,.45);background:var(--card)}.thumb,.spec,.toast,.ov{border-radius:12px}
button{border-radius:10px;padding:6px 13px;font-weight:500}button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
input,select{border-radius:10px}.badge{letter-spacing:.02em}textarea{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.dial{touch-action:none;cursor:pointer}.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}.home .card{margin:0}button:disabled{opacity:.45;cursor:not-allowed}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.slot{border:1px dashed var(--bd);border-radius:14px;padding:8px;text-align:center;background:var(--bg)}.slot img{height:80px;max-width:100%;object-fit:contain}.slot .ph{height:80px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}.upl{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--card)}.upl:hover{border-color:var(--ac)}button.rst{background:color-mix(in srgb,var(--ac) 24%,var(--card));border-color:var(--ac);color:var(--tx)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== STIMULUS CONFIG: edit this block to change product, views, errors, shots ===== */
var CODE='research'; /* researcher code: change it */
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function nextAlt(){var n=0;try{n=+localStorage.getItem('alt')||0;localStorage.setItem('alt',String(n+1))}catch(x){n=Math.floor(Math.random()*2)}return n%2?'labeled':'baseline'}
var PRODUCT='Aqua bottle';
var ORIG={body:'#2a6f97',cap:'#1b263b',band:'#e9ecef',capShape:'round'};
var SHEET='Blue body, dark navy round cap, light band, circular logo on the front.';
function sp(o){var r={kind:'side',logo:false,text:false,body:ORIG.body,cap:ORIG.cap,band:ORIG.band,capShape:ORIG.capShape};for(var k in o)r[k]=o[k];return r}
var VIEWS=[
 {id:'front',name:'Front',src:'uploaded',spec:sp({logo:true}),truth:sp({logo:true}),err:false},
 {id:'left',name:'Left side',src:'uploaded',spec:sp({}),truth:sp({}),err:false},
 {id:'back',name:'Back',src:'ai',spec:sp({text:true}),truth:sp({text:true}),err:false},
 {id:'right',name:'Right side',src:'ai',spec:sp({cap:'#f77f00'}),truth:sp({}),err:true},
 {id:'top',name:'Top',src:'ai',spec:sp({kind:'top',capShape:'square'}),truth:sp({kind:'top'}),err:true},
 {id:'detail',name:'Logo detail',src:'ai',spec:sp({kind:'detail'}),truth:sp({kind:'detail'}),err:false}
];
var SHOTS=[{n:'Shot 1: Hero front',v:'front'},{n:'Shot 2: Turntable pass',v:'right'},{n:'Shot 3: Cap macro, top-down',v:'top'}];
/* ===== END CONFIG ===== */
var SAMPLE={views:VIEWS,shots:SHOTS,product:PRODUCT,sheet:SHEET};
var CFG={custom:false,product:'My product',sheet:'',views:[{name:'Front',src:'uploaded',err:false,img:'',fix:''},{name:'Back',src:'ai',err:false,img:'',fix:''}],shots:[{n:'Shot 1',vi:0},{n:'Shot 2',vi:1}]};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function origs(){return VIEWS.filter(function(v){return v.src==='uploaded'}).map(function(v){return svg(v.truth)}).join('')}
function stim(){return '<div class="card"><h2>Stimuli (researcher)</h2><label><input type="checkbox" data-a="custom"'+(CFG.custom?' checked':'')+'> Use my own images instead of the sample bottle</label>'+(CFG.custom?cfgForm():'<p class="mut">Using the drawn sample bottle.</p>')+'</div>'}
function cfgForm(){var c=CFG;return '<p class="mut">Images stay in this browser tab and are lost on reload. Mark AI views that contain a planted error and add the corrected image (what the view should have looked like).</p><label>Product name<br><input data-f="product" value="'+esc(c.product)+'"></label><label>Product sheet (what the original materials say)<br><input data-f="sheet" style="width:100%" value="'+esc(c.sheet)+'"></label>'+c.views.map(function(v,i){return '<div class="vrow"><div class="row" style="margin:0 0 6px"><input data-f="name" data-i="'+i+'" value="'+esc(v.name)+'"><select data-f="src" data-i="'+i+'"><option value="uploaded"'+(v.src==='uploaded'?' selected':'')+'>Uploaded (original)</option><option value="ai"'+(v.src==='ai'?' selected':'')+'>AI-inferred</option></select><button data-a="rmview" data-i="'+i+'">Remove</button></div><div class="row" style="margin:0"><span>Image '+(v.img?'<img src="'+v.img+'" alt="">':'<span class="err">missing</span>')+'<br><input type="file" accept="image/*" data-f="img" data-i="'+i+'"></span>'+(v.src==='ai'?'<span><label style="margin:0"><input type="checkbox" data-f="err" data-i="'+i+'"'+(v.err?' checked':'')+'> Planted error</label>'+(v.err?'Corrected image '+(v.fix?'<img src="'+v.fix+'" alt="">':'<span class="err">missing</span>')+'<br><input type="file" accept="image/*" data-f="fix" data-i="'+i+'">':'')+'</span>':'')+'</div></div>'}).join('')+'<button data-a="addview">Add view</button><h2 style="margin-top:12px">Shots (each uses one view)</h2>'+c.shots.map(function(s,i){return '<div class="row" style="margin:4px 0"><input data-f="shotn" data-i="'+i+'" value="'+esc(s.n)+'"><select data-f="shotv" data-i="'+i+'">'+c.views.map(function(v,j){return '<option value="'+j+'"'+(s.vi===j?' selected':'')+'>'+esc(v.name)+'</option>'}).join('')+'</select></div>'}).join('')}
function applyCfg(){var m=document.getElementById('msg');if(!CFG.custom){VIEWS=SAMPLE.views;SHOTS=SAMPLE.shots;PRODUCT=SAMPLE.product;SHEET=SAMPLE.sheet;return true}
 var vs=CFG.views,er='';if(vs.length<2)er='Add at least two views.';
 vs.forEach(function(v,i){if(!v.img)er='Every view needs an image ('+(v.name||'view '+(i+1))+').';if(v.src!=='ai')v.err=false;if(v.err&&!v.fix)er='Add a corrected image for the planted error: '+v.name+'.'});
 if(!vs.some(function(v){return v.src==='uploaded'}))er='At least one view must be an uploaded original.';
 if(er){m.textContent=er;return false}
 VIEWS=vs.map(function(v,i){return {id:'v'+i,name:v.name||('View '+(i+1)),src:v.src,spec:{img:v.img},truth:{img:v.err?v.fix:v.img},err:!!v.err}});
 SHOTS=CFG.shots.map(function(s){return {n:s.n,v:'v'+Math.min(s.vi,vs.length-1)}});PRODUCT=CFG.product;SHEET=CFG.sheet;return true}
var STEPS=['consent','setup','tutorial','materials','review','story','quest','debrief','results'];
var LABELS={consent:'Consent',setup:'Setup',tutorial:'Tutorial',materials:'Materials',review:'Review',story:'Storyboard',quest:'Questions',debrief:'Debrief',results:'Results'};
var S={step:(location.hash==='#study'?'setup':'home'),auth:false,pid:'',cond:'labeled',views:{},cmp:null,cmpStart:0,cmpMs:0,log:[],t0:Date.now(),tRev:0,revMs:0,toast:'',q:null,consent:false};
function svg(s){if(s.img)return '<img src="'+s.img+'" alt="">';var o='<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">';
 if(s.kind==='top'){o+='<circle cx="60" cy="80" r="52" fill="'+s.body+'"/>'+(s.capShape==='round'?'<circle cx="60" cy="80" r="26" fill="'+s.cap+'"/>':'<rect x="36" y="56" width="48" height="48" fill="'+s.cap+'"/>')}
 else if(s.kind==='detail'){o+='<rect x="10" y="20" width="100" height="120" rx="10" fill="'+s.body+'"/><circle cx="60" cy="80" r="34" fill="#fff"/><circle cx="60" cy="80" r="22" fill="'+s.body+'"/><circle cx="60" cy="80" r="8" fill="#fff"/>'}
 else{o+='<rect x="40" y="8" width="40" height="18" rx="3" fill="'+s.cap+'"/><rect x="30" y="26" width="60" height="120" rx="14" fill="'+s.body+'"/><rect x="30" y="70" width="60" height="26" fill="'+s.band+'"/>';
  if(s.logo)o+='<circle cx="60" cy="83" r="9" fill="'+s.body+'"/>';if(s.text)o+='<rect x="40" y="108" width="40" height="3" fill="#fff"/><rect x="44" y="116" width="32" height="3" fill="#fff"/>'}
 return o+'</svg>'}
function log(type,d){var e={t:Date.now()-S.t0,pid:S.pid,cond:S.cond,type:type};for(var k in d)e[k]=d[k];S.log.push(e)}
function vget(id){return VIEWS.filter(function(v){return v.id===id})[0]}
function init(){S.views={};VIEWS.forEach(function(v){S.views[v.id]={status:'pending',src:v.src,spec:v.spec,replaced:false,conf:0,cmpN:0,cmpMs:0}})}
function badge(src){var m={uploaded:['Uploaded','b-up'],ai:['AI-inferred','b-ai'],user:['User-edited','b-ue']}[src];return '<span class="badge '+m[1]+'">'+m[0]+'</span>'}
function impact(id){return SHOTS.filter(function(s){return s.v===id}).map(function(s){return s.n.split(':')[0]}).join(', ')}
function nav(back,next,nl){return '<div class="row" style="margin-top:16px">'+(back?'<button data-a="go" data-to="'+back+'">Back</button>':'<span></span>')+'<button class="pri" data-a="go" data-to="'+next+'">'+(nl||'Continue')+'</button></div>'}
/* ---------- pages ---------- */
var P={
home:function(){return '<h1>What would you like to do?</h1><p class="mut">Make views of a product with AI and review them, or run the controlled study.</p><div class="home"><div class="card"><h2>Make</h2><p>Choose a viewpoint, generate new views of your product, and review each AI-made view before it enters your video.</p><button class="pri" data-a="mkgo">Open Make</button></div><div class="card"><h2>Study</h2><p>Run the controlled evaluation with pre-made views and planted errors. Researcher access only.</p><button data-a="mkstudy">Open Study</button></div></div><p class="mut">Make currently uses a mock generator while the backend is being set up.</p>'},
mk:function(){var n=M.imgs.length,g=M.gen.length;
 var h='<h1>Make</h1><p class="mut">Create new views of your product, then review every AI-made view before it goes into your video. Results are mock placeholders until a generator is connected.</p>';
 h+='<div class="card"><h2>1. Your product</h2><p class="mut">Upload a photo for each side you have. Sides you skip are the ones the AI will have to invent.</p><div class="slots">'+SIDES.map(function(s){var it=M.imgs.filter(function(x){return x.side===s[0]})[0];return '<div class="slot"><div class="st" style="margin-bottom:4px">'+s[1]+'</div>'+(it?'<img src="'+it.data+'" alt="">':'<div class="ph">No photo</div>')+'<div style="margin-top:6px"><label class="upl">'+(it?'Replace':'Upload')+'<input type="file" accept="image/*" data-side="'+s[0]+'" hidden></label>'+(it?' <button data-a="mkrm" data-side="'+s[0]+'">Remove</button>':'')+'</div></div>'}).join('')+'</div><label style="margin-top:10px">Product sheet (what it looks like)<br><input id="mks" style="width:100%" value="'+esc(M.sheet)+'"></label></div>';
 h+='<div class="card"><h2>2. Place the camera</h2><div class="row" style="justify-content:flex-start;gap:22px;align-items:flex-start;margin-top:0">'+dial()+preview()+'<div style="flex:1;min-width:230px">'+sl('Rotation','az',0,359,1)+sl('Height','el',-30,85,1)+sl('Distance','dist',0,100,1)+sl('Tilt','roll',-30,30,1)+sl('Lens','lens',24,85,1)+'</div></div>';
 h+='<div class="row" style="justify-content:flex-start;gap:6px;margin-top:12px"><button data-a="mkreset" class="rst">Reset view</button><span class="st">Presets</span>'+[['Front',0,0],['Right',90,0],['Back',180,0],['Left',270,0],['Three-quarter',45,25],['Top',0,80]].map(function(p){return '<button data-a="mkpre" data-az="'+p[1]+'" data-el="'+p[2]+'">'+p[0]+'</button>'}).join('')+'<button data-a="mksnap"'+(M.snap?' class="pri"':'')+'>Snap rotation to 45°: '+(M.snap?'on':'off')+'</button></div>';
 h+='<label style="margin-top:12px">Prompt (you can edit it)<br><textarea id="mkp" rows="4" style="width:100%">'+esc(M.pe?M.prompt:autoPrompt())+'</textarea></label><div class="row"><span class="mut">Move the sliders or drag the dial. The prompt updates until you edit it yourself.</span><button class="pri" data-a="mkgen"'+(M.busy||!n?' disabled':'')+'>'+(M.busy?'Generating...':'Generate view')+'</button></div>'+(M.err?'<div class="err">'+esc(M.err)+'</div>':'')+'</div>';
 h+='<div class="card"><h2>3. Generated views</h2>'+(g?'<div class="grid">'+M.gen.map(function(x,i){return '<div class="card" style="margin:0"><div class="thumb"><img src="'+x.img+'" alt=""></div><div class="row" style="margin-top:0"><strong>'+esc(x.name)+'</strong><span class="badge b-ai">'+(x.mock?'Mock':'AI-generated')+'</span></div><div class="row"><span class="st">'+x.az+'°, '+x.el+'°, '+dWord(x.dist)+'</span><button data-a="mkrmg" data-i="'+i+'">Remove</button></div></div>'}).join('')+'</div>':'<p class="mut">Nothing yet. Place the camera and press Generate view.</p>')+'<div class="row" style="margin-top:12px"><button data-a="home">Back</button><button class="pri" data-a="mkreview"'+(g?'':' disabled')+'>Review '+g+' view'+(g===1?'':'s')+'</button></div></div>';
 return h},
consent:function(){return '<h1>Study information and consent</h1><div class="card"><p>You will review product images that an AI tool created for a video project, then answer a few short questions. This takes about 15 minutes.</p><p>The interface is a prototype. The images are pre-made and not generated live. We record your clicks and answers, not your identity. You may stop at any time.</p><label><input type="checkbox" id="cons"> I have read this and agree to take part.</label></div><button class="pri" data-a="consent">Continue</button><div id="msg" class="err"></div>'},
setup:function(){if(!S.auth)return '<h1>Researcher access</h1><div class="card"><label>Researcher code<br><input id="code" type="password"></label></div><button class="pri" data-a="unlock">Unlock</button> <button data-a="home">Back</button><div id="msg" class="err"></div>';var sel=function(v,t){return '<option value="'+v+'"'+(S.condSel===v?' selected':'')+'>'+t+'</option>'};return '<h1>Session setup</h1><div class="card"><label>Participant ID<br><input id="pid" value="'+S.pid+'"></label><label>Condition (researcher)<br><select id="cond">'+sel('alt','Alternate A/B (this device)')+sel('random','Random')+sel('baseline','A: Baseline')+sel('labeled','B: Labeled + compare + replace')+sel('forced','C: Labeled + forced review')+'</select></label><label>Compare style (B and C)<br><select id="cmode"><option value="side"'+(S.cmode==='slide'?'':' selected')+'>Side by side</option><option value="slide"'+(S.cmode==='slide'?' selected':'')+'>Overlay slider</option></select></label></div>'+stim()+'<button class="pri" data-a="start">Start</button><div id="msg" class="err"></div>'},
tutorial:function(){var L=S.cond!=='baseline';return '<h1>Quick tutorial</h1><div class="card"><p>You are helping make a product video for a bottle brand. Before shots are made, the tool prepares product views from different angles. Some views come from photos you uploaded, and some were created by the AI.</p><p><strong>In this task you can:</strong></p><p>'+(L?'• See where each view came from<br>• Compare a view with your original materials<br>• Approve, reject or replace views'+(S.cond==='forced'?'<br>• Before approving an AI-made view, compare it with your originals':''):'• Keep or remove each view')+'<br>• Rate how confident you are in each view</p><p>Views you keep will be used to build the video shots in the next step.</p></div>'+nav('consent','materials')},
materials:function(){return '<h1>Your original materials</h1><p class="mut">These are the photos and product sheet you uploaded. Take a moment to look at them.</p><div class="card"><div class="thumb">'+origs()+'</div><div class="spec"><strong>Product sheet ('+PRODUCT+'):</strong> '+SHEET+'</div></div>'+nav('tutorial','review','Start review')},
review:function(){var L=S.cond!=='baseline';
 var h='<h1>Review product views</h1><p class="mut">Check the views before they are used to build your shots, then continue.</p>'+(S.toast?'<div class="toast">'+S.toast+'</div>':'')+'<div class="grid">'+VIEWS.map(function(v){var s=S.views[v.id];

function copy(t){var m=document.getElementById('msg');try{navigator.clipboard.writeText(t).then(function(){m.textContent='Copied.'},function(){m.textContent='Copy failed. Select the text manually.'})}catch(x){m.textContent='Copy failed. Select the text manually.'}}
document.addEventListener('input',function(e){var t=e.target,d=t.dataset||{};if(t.id==='pid')S.pid=t.value;else if(d.f==='product')CFG.product=t.value;else if(d.f==='sheet')CFG.sheet=t.value;else if(d.f==='name')CFG.views[+d.i].name=t.value;else if(d.f==='shotn')CFG.shots[+d.i].n=t.value;else if(d.a==='ov'){S.ovPos=+t.value;var oa=document.querySelector('.ova');if(oa)oa.style.clipPath='inset(0 0 0 '+t.value+'%)'}else if(d.k){mkSet(d.k,+t.value)}else if(t.id==='mkp'){M.prompt=t.value;M.pe=true}else if(t.id==='mks'){M.sheet=t.value;var tt=document.getElementById('mkp');if(tt&&!M.pe)tt.value=autoPrompt()}});
document.addEventListener('change',function(e){var t=e.target,d=t.dataset||{};
 if(d.a==='conf'){S.views[d.id].conf=+t.value;log('confidence',{view:d.id,value:+t.value})}
 else if(t.id==='cond')S.condSel=t.value;
 else if(d.a==='custom'){CFG.custom=t.checked;render()}
 else if(d.f==='src'){CFG.views[+d.i].src=t.value;render()}
 else if(d.f==='err'){CFG.views[+d.i].err=t.checked;render()}
 else if(d.side){var fl=t.files&&t.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){setSide(d.side,rd.result,fl.name);render()};rd.readAsDataURL(fl)}
 else if(t.id==='mkfile'){Array.prototype.slice.call(t.files).slice(0,Math.max(0,3-M.imgs.length)).forEach(function(f){var r=new FileReader();r.onload=function(){M.imgs.push({name:f.name,data:r.result});render()};r.readAsDataURL(f)})}
 else if(d.a==='ovsel'){S.ovIdx=+t.value;log('overlay_ref',{ref:t.value});render()}
 else if(d.a==='ov'){log('overlay_drag',{view:S.cmp,pos:+t.value})}
 else if(d.f==='shotv')CFG.shots[+d.i].vi=+t.value;
 else if(d.f==='img'||d.f==='fix'){var f=t.files&&t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){CFG.views[+d.i][d.f]=r.result;render()};r.readAsDataURL(f)}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,id=b.dataset.id,s=id&&S.views[id];
 if(a==='consent'){if(!document.getElementById('cons').checked){document.getElementById('msg').textContent='Please tick the box to continue.';return}S.consent=true;S.step='tutorial'}
 else if(a==='start'){if(!applyCfg())return;S.pid=document.getElementById('pid').value.trim();var c=document.getElementById('cond').value;S.cmode=document.getElementById('cmode').value;S.ovIdx=0;S.ovPos=50;S.cond=c==='random'?(Math.random()<.5?'baseline':'labeled'):c==='alt'?nextAlt():c;S.t0=Date.now();S.log=[];S.cmpMs=0;S.revMs=0;S.q=null;S.auth=false;S.mode='study';VIEWS=shuf(VIEWS);init();S.step='consent';log('start',{order:VIEWS.map(function(v){return v.id})})}
 else if(a==='go')goto(b.dataset.to)
 else if(a==='cmp'){if(S.cmp)closeCmp();S.cmp=id;S.views[id].cmpN++;S.cmpStart=Date.now();log('compare_open',{view:id})}
 else if(a==='closecmp')closeCmp()
 else if(a==='approve'){if(S.cond==='forced'&&s.src==='ai'&&!s.cmpN){S.toast='Please compare this view with your original materials before approving it.';log('approve_blocked',{view:id})}else{s.status='approved';S.toast='';log('approve',{view:id,source:s.src,viewed:S.cmp===id})}}
 else if(a==='reject'){s.status='rejected';S.toast=(S.cond!=='baseline'&&impact(id))?'Rejected. This affects '+impact(id)+'.':'';log('reject',{view:id,source:s.src})}
 else if(a==='replace'){s.spec=vget(id).truth;s.src='user';s.status='approved';s.replaced=true;S.toast=impact(id)?'Replaced. '+impact(id)+' will use your edited view.':'';log('replace',{view:id})}
 else if(a==='toggle'){s.status=s.status==='approved'?'rejected':'approved';log('toggle',{view:id,status:s.status})}
 else if(a==='submitq'){var ai=VIEWS.filter(function(v){return document.getElementById('qa_'+v.id).checked}).map(function(v){return v.id});S.q={ai:ai,qt:(qsel()||{}).id||'',q2:tcorr(),q3:document.getElementById('q3').value,q4:document.getElementById('q4').value,q5:document.getElementById('q5').value};log('questionnaire',S.q);goto('debrief');saveSession()}
 else if(a==='copylog'){copy(JSON.stringify(S.log));return}
 else if(a==='copyp'){copy(tsv(PH,allP()));return}
 else if(a==='copyv'){copy(tsv(VH,allV()));return}
 else if(a==='clear'){if(S.clr){try{localStorage.removeItem('sessions')}catch(x){}S.clr=false}else{S.clr=true}}
 else if(a==='addview'){CFG.views.push({name:'View '+(CFG.views.length+1),src:'ai',err:false,img:'',fix:''})}
 else if(a==='rmview'){var ri=+b.dataset.i;CFG.views.splice(ri,1);CFG.shots.forEach(function(sh){if(sh.vi===ri)sh.vi=0;else if(sh.vi>ri)sh.vi--})}
 else if(a==='mkreset'){for(var k in DEF)M[k]=DEF[k];kick()}
 else if(a==='mkpre'){M.az=+b.dataset.az;M.el=+b.dataset.el;if(M.snap)M.az=(Math.round(M.az/45)*45)%360;kick()}
 else if(a==='mksnap'){M.snap=!M.snap;if(M.snap)M.az=(Math.round(M.az/45)*45)%360;kick()}
 else if(a==='mkgo'){S.step='mk'}
 else if(a==='mkstudy'){S.step='setup'}
 else if(a==='home'){S.step='home'}
 else if(a==='mkrm'){M.imgs=M.imgs.filter(function(x){return x.side!==b.dataset.side})}
 else if(a==='mkrmg'){M.gen.splice(+b.dataset.i,1)}
 else if(a==='mkel'){M.el=+b.dataset.v}
 else if(a==='mkdist'){M.dist=+b.dataset.v}
 else if(a==='mkgen'){mkGen();return}
 else if(a==='mkreview'){startReview()}
 else if(a==='unlock'){var cd=document.getElementById('code');if(!cd||cd.value!==CODE){var mm=document.getElementById('msg');if(mm)mm.textContent='Wrong code.';return}S.auth=true;S.step=S.step==='debrief'?'results':'setup'}
 else if(a==='restart'){S.step='setup'}
 render()});
render();
</script>
